<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Diário Offline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="diario-container">
        <h1>📖 Meu Diário de Cada Dia</h1>
        
        <!-- Campo para escrever a memória do dia -->
        <textarea id="texto-diario" placeholder="Como foi o seu dia hoje? Escreva aqui..."></textarea>
        
        <button onclick="salvarMemoria()">Guardar no Diário</button>

        <!-- Histórico de textos salvos -->
        <h2>Histórico de Memórias</h2>
        <div id="historico-memorias"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
